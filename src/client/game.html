<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#211b1e" />
    <title>MOLT</title>
  </head>
  <body data-loading="true">
    <main id="app" aria-label="Molt game">
      <header class="game-header">
        <div class="wordmark">
          <canvas
            id="header-title"
            width="510"
            height="108"
            role="img"
            aria-label="MOLT"
          ></canvas>
        </div>
        <div class="header-actions" role="group" aria-label="Game controls">
          <button
            id="sound-button"
            class="icon-button"
            type="button"
            aria-label="Mute sound"
            title="Mute sound"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 9h4l5-4v14l-5-4H4z" />
              <path
                class="sound-wave"
                d="M17 8c2 2 2 6 0 8m3-11c4 4 4 10 0 14"
              />
              <path class="sound-muted" d="m17 9 5 6m0-6-5 6" />
            </svg>
          </button>
          <button
            id="settings-button"
            class="icon-button"
            type="button"
            aria-label="Controls and settings"
            title="Controls and settings"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 7h4m4 0h8M4 17h8m4 0h4" />
              <circle cx="10" cy="7" r="2" />
              <circle cx="14" cy="17" r="2" />
            </svg>
          </button>
          <button
            id="pause-button"
            class="icon-button"
            type="button"
            aria-label="Pause game"
            title="Pause · Esc"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path class="pause-symbol" d="M8 5v14M16 5v14" />
              <path class="resume-symbol" d="m8 5 11 7-11 7z" />
            </svg>
          </button>
        </div>
      </header>
      <section class="game-shell" aria-label="Game arena">
        <div class="hud" id="hud">
          <div class="health-group" id="life-group" role="img" aria-label="Life">
            <span class="hud-label">LIFE <span id="life-warning" hidden>LOW</span></span>
            <div class="health-meter" aria-hidden="true">
              <div id="life-pips" class="health-pips"></div>
              <span id="core-value" class="health-value">—</span>
            </div>
          </div>
          <div class="body-group">
            <span class="hud-label">UPGRADES</span>
            <span id="host-name">0 / 5</span>
          </div>
          <div class="chamber-group">
            <span class="hud-label">CHAMBER</span
            ><span id="chamber-value">01 / 06</span>
          </div>
          <p id="health-note" class="health-note" role="status">Space / Click to dash through bullets.</p>
        </div>
        <div class="stage-wrap">
          <div
            id="world"
            role="application"
            aria-label="Move with WASD or arrows. Aim with the mouse to auto-fire. Click or press Space to Dash through enemy bullets. You have 3 hearts. Clear the chamber to recover 1 heart and pick an upgrade."
          ></div>
          <div id="live-hint" aria-live="polite"></div>
          <div id="daily-foreshadow" hidden></div>
          <div id="overlay" class="overlay">
            <div class="loading">
              <span class="little-worm"></span>
              <p>Loading chamber…</p>
              <p class="loading-recovery">
                Taking a while? <a href="">Reload this game</a>.
              </p>
            </div>
          </div>
        </div>
        <div class="mutation-strip" id="mutation-strip">
          <span>DODGE THE VOLLEY.</span><span>STACK YOUR UPGRADES.</span>
        </div>
        <div class="control-deck" id="control-deck">
          <div class="move-control">
            <div id="move-pad" class="move-pad" aria-label="Drag to move">
              <span class="stick"></span>
            </div>
            <span class="control-caption">MOVE</span>
          </div>
          <p id="control-tip"></p>
          <div class="action-controls">
            <button id="ability-button" class="ability-button" type="button">
              <span id="ability-name">DASH</span
              ><span id="ability-state" class="sr-only">Ready</span
              ><kbd>SPACE</kbd>
            </button>
          </div>
        </div>
      </section>
      <footer class="game-footer">
        <span id="challenge-label">DAILY ESCAPE</span
        ><span id="save-status" role="status"></span>
      </footer>
      <noscript
        >MOLT needs JavaScript to run its combat. Enable JavaScript and
        reload.</noscript
      >
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
