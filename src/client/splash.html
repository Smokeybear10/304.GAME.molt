<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MOLT</title>
    <meta name="theme-color" content="#e7ddc5" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #e7ddc5;
        color: #292628;
        font: 16px/1.4 Georgia, serif;
      }
      .entry {
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 20px clamp(20px, 6vw, 40px);
        max-width: 620px;
        margin: auto;
      }
      .eyebrow {
        font: 11px "Courier New", monospace;
        letter-spacing: 2px;
        color: #735d45;
        margin: 0 0 8px;
      }
      h1 {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
      }
      canvas {
        display: block;
        max-width: 100%;
        height: auto;
      }
      #splash-title {
        width: 100%;
        max-width: 400px;
        margin-bottom: 4px;
      }
      #splash-cast {
        width: 100%;
        max-width: 400px;
        margin: 0 0 8px;
      }
      .premise {
        font-size: clamp(17px, 4.8vw, 22px);
        line-height: 1.4;
        margin: 0 0 20px;
      }
      .premise strong {
        font-weight: 400;
        font-style: italic;
      }
      button {
        font: 17px/1.2 Georgia, serif;
        padding: 14px 24px;
        min-height: 52px;
        color: #fff0cb;
        background: #b84332;
        border: 1px solid #7d2c26;
        box-shadow: 0 3px #743426;
        cursor: pointer;
        width: 100%;
        max-width: 350px;
        touch-action: manipulation;
      }
      button:hover {
        background: #a3342b;
      }
      button:active {
        transform: translateY(2px);
        box-shadow: 0 1px #743426;
      }
      button:focus-visible {
        outline: 3px solid #292628;
        outline-offset: 5px;
      }
      .detail {
        font: 11px/1.5 "Courier New", monospace;
        color: #735d45;
        margin: 17px 0 0;
      }
      #status {
        font: 12px/1.4 Georgia, serif;
        color: #735d45;
        margin: 6px 0 0;
        min-height: 17px;
        max-width: 360px;
      }
      noscript {
        display: block;
        padding: 18px;
      }
      @media (max-height: 480px) {
        .entry {
          padding-top: 12px;
          padding-bottom: 12px;
        }
        .eyebrow {
          margin-bottom: 4px;
        }
        #splash-title {
          max-width: 320px;
        }
        #splash-cast {
          max-width: 330px;
        }
        .premise {
          font-size: 17px;
          line-height: 1.25;
          margin-bottom: 10px;
        }
        .detail {
          margin-top: 10px;
        }
      }
      @media (max-height: 400px) {
        #splash-cast {
          display: none;
        }
      }
      @media (max-height: 400px) and (min-width: 520px) {
        .entry {
          display: grid;
          grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr);
          column-gap: 20px;
          align-content: center;
          justify-items: center;
        }
        .eyebrow {
          grid-area: 1 / 1;
        }
        #splash-title {
          grid-area: 2 / 1;
          max-width: 250px;
        }
        #splash-cast {
          display: block;
          grid-area: 3 / 1 / 6 / 2;
          max-width: 260px;
          margin: 0;
        }
        .premise {
          grid-area: 1 / 2 / 3 / 3;
        }
        #play {
          grid-area: 3 / 2;
        }
        .detail {
          grid-area: 4 / 2;
        }
        #status {
          grid-area: 5 / 2;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        button:active {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="entry">
      <h1>MOLT</h1>
      <p class="eyebrow">A DAILY BULLET-HELL ESCAPE</p>
      <canvas
        id="splash-title"
        width="1020"
        height="216"
        aria-hidden="true"
      ></canvas>
      <canvas
        id="splash-cast"
        width="640"
        height="200"
        aria-hidden="true"
      ></canvas>
      <p class="premise">
        Dodge the swarm.<br /><strong
          >Stack wild upgrades. Survive six chambers.</strong
        >
      </p>
      <button id="play" type="button">Play this escape</button>
      <p class="detail">Six chambers · Same escape for everyone</p>
      <p id="status" role="status">
        Your run saves between chambers. Retry as often as you like.
      </p>
    </main>
    <noscript
      >MOLT needs JavaScript to run. Open this post in the Reddit app or on
      reddit.com.</noscript
    >
    <script type="module" src="./splash.ts"></script>
  </body>
</html>
